[project]
name = "liverseg"
version = "0.1.0"
description = "Liver Disease Segmentation & Tumor Characterization from MRI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.5.1+cpu",
    "numpy>=1.24.0,<2.0.0",
    "opencv-python-headless>=4.8.0,<4.12.0",
    "pillow>=10.0.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0"
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
